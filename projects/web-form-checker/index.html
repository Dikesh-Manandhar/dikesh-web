<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoseCoach AI | Pro Form Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4ade80;
            --primary-hover: #22c55e;
            --bg-dark: #0f172a;
            --bg-overlay: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --accent: #facc15;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
        }

        .fullscreen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #webcam, #output_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #output_canvas {
            z-index: 1;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }

        .overlay * {
            pointer-events: auto;
        }

        .top-left { top: 2rem; left: 2rem; }
        .top-right { top: 2rem; right: 2rem; display: flex; flex-direction: column; gap: 1rem; align-items: flex-end; }
        .bottom-right { bottom: 2rem; right: 2rem; text-align: right; }
        .bottom-left { bottom: 2rem; left: 2rem; max-width: 400px; }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .control-panel {
            background: var(--bg-overlay);
            backdrop-filter: blur(12px);
            padding: 1.25rem;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 220px;
        }

        select {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-dark);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-family: inherit;
            outline: none;
        }

        .btn {
            padding: 0.6rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-family: inherit;
            text-align: center;
        }

        .btn-primary { background-color: var(--primary); color: var(--bg-dark); }
        .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .stat-group { display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
        .stat-value { font-size: 5rem; font-weight: 800; color: var(--primary); line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .stat-label { color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 0.875rem; letter-spacing: 0.1em; }

        .feedback-box {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            border-left: 6px solid var(--accent);
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        /* Range Bar */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            z-index: 5;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            box-shadow: 0 0 20px var(--primary);
            transition: width 0.1s ease;
        }

        /* Guide Overlay */
        .guide-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 2rem;
            pointer-events: none;
        }
        .guide-card {
            background: var(--bg-card);
            background: var(--bg-overlay);
            backdrop-filter: blur(16px);
            padding: 2rem;
            border-radius: 32px;
            border: 2px solid var(--primary);
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .guide-card h2 { margin: 0 0 1rem 0; color: var(--primary); }
        .guide-card p { color: var(--text-main); line-height: 1.6; margin-bottom: 1.5rem; }
        .guide-img {
            width: 200px;
            height: 200px;
            margin: 0 auto 1.5rem auto;
            background: #334155;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 1rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Initializing AI Engine...</div>
    </div>

    <div class="fullscreen-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>

        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>

        <!-- Guide Overlay -->
        <div id="guide-overlay" class="guide-overlay">
            <div class="guide-card">
                <div id="guide-icon" class="guide-img">🧘</div>
                <h2 id="guide-title">Position Yourself</h2>
                <p id="guide-text">Please step back and ensure your full body is visible to the camera.</p>
            </div>
        </div>

        <div class="overlay top-left">
            <div class="header">
                <h1>PoseCoach <span style="color: var(--primary)">AI</span></h1>
            </div>
        </div>

        <div class="overlay top-right">
            <div class="control-panel">
                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                    <label style="font-size: 0.75rem; color: var(--text-dim); font-weight: 600;">EXERCISE</label>
                    <select id="exercise_select">
                        <option value="Pushups">Pushups</option>
                        <option value="Squats">Squats</option>
                        <option value="Pullups">Pullups</option>
                    </select>
                </div>
                <button id="start_btn" class="btn btn-primary">Start Session</button>
                <button id="stop_btn" class="btn btn-danger">Stop</button>
            </div>
        </div>

        <div class="overlay bottom-right">
            <div class="stat-group">
                <span id="count_val" class="stat-value">0</span>
                <span class="stat-label">Reps</span>
                <span id="range_val" style="color: var(--text-dim); font-weight: 600; margin-top: 0.5rem;">0% Range</span>
            </div>
        </div>

        <div class="overlay bottom-left">
            <div id="feedback" class="feedback-box">Ready to track your session!</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <script src="script.js"></script>
</body>
</html>
